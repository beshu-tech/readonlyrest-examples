readonlyrest:

  audit:
    enabled: true
    outputs: [index]

  access_control_rules:

    - name: "KIBANA"
      type: allow
      auth_key: kibana:kibana

    # Per-user identity via Authorization passthrough. When the MCP server runs
    # in http mode it forwards the client's own Authorization header to
    # Elasticsearch, so ordinary basic auth reaches ROR unchanged — the MCP
    # server itself holds no credentials.
    - name: "Analyst via MCP"
      type: allow
      auth_key: analyst:analyst
      indices: ["logs-*"]
      actions:
        - "indices:data/read/*"
        - "indices:admin/mappings/get"
        - "indices:monitor/*"
        - "cluster:monitor/*"

    - name: "Admins"
      type: allow
      auth_key: admin:admin
      kibana:
        access: admin
