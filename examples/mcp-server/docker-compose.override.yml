services:

  # Elastic MCP server for Elasticsearch (elastic/mcp-server-elasticsearch),
  # in HTTP mode, with no credentials of its own: every client must send its
  # own Authorization header, which the server forwards to Elasticsearch/ROR.
  mcp-server:
    image: docker.elastic.co/mcp/elasticsearch:${MCP_SERVER_VERSION:-0.4.6}
    hostname: mcp-server
    # --container-mode makes the server listen on 0.0.0.0:8080 instead of the
    # default 127.0.0.1:8080, which is required for the host port mapping
    # below to work.
    command: ["http", "--container-mode"]
    environment:
      # No ES_API_KEY / ES_USERNAME: the server starts unauthenticated and
      # relies entirely on the caller's forwarded Authorization header.
      - ES_URL=https://es-ror:9200
      # The MCP server has no custom-CA option, only an on/off switch, and this
      # cluster uses a self-signed certificate.
      - ES_SSL_SKIP_VERIFY=true
    # Waiting for the initializer (its /tmp/init_done healthcheck) means the
    # demo indices exist by the time an MCP client can connect.
    depends_on:
      initializer:
        condition: service_healthy
    ports:
      - "18080:8080"
    networks:
      - ror-network
    # No healthcheck: the image (wolfi-base + busybox) ships neither curl nor
    # wget, and nothing in this example depends on mcp-server being healthy.
