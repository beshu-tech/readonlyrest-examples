# Logstash shipping to Elasticsearch with a client certificate and nothing else.
#
# There is no user, no password and no API key anywhere in this file. ReadonlyREST works out who this
# is from the certificate presented during the TLS handshake: CN=svc-logstash gives the username, and
# OU=ingest gives the group that grants writes on logs-*.

input {
  # One event every 5 seconds - slow enough not to flood, fast enough that a document count visibly
  # moves between two curl calls.
  heartbeat {
    interval => 5
    message  => "shipped by svc-logstash, authenticated by certificate alone"
  }
}

filter {
  mutate {
    add_field    => { "service" => "svc-logstash" }
    remove_field => [ "@version", "event", "host" ]
  }
}

output {
  elasticsearch {
    hosts => [ "https://es-ror:9200" ]
    index => "logs-2026"

    # The credential. That is the whole configuration.
    ssl_enabled                 => true
    ssl_certificate             => "/certs/svc-logstash.crt"
    ssl_key                     => "/certs/svc-logstash.key"
    ssl_certificate_authorities => [ "/certs/ca.crt" ]

    # ReadonlyREST grants this certificate writes on logs-* and nothing more. Index template and ILM
    # management are cluster-level operations, so turn them off rather than widening the ACL - which is
    # what you would want for a locked-down ingest account in production too.
    manage_template => false
    ilm_enabled     => false
  }

  # Report what was shipped, so `docker logs` shows the certificate did the work.
  stdout {
    codec => rubydebug
  }
}
