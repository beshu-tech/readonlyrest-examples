services:

  # The CA that issued the client certificates has to sit next to elasticsearch.yml, so the node can
  # verify the chains the services present.
  es-ror:
    volumes:
      - ${EXAMPLE_DIR}/certs/pki-ca.crt:/usr/share/elasticsearch/config/pki-ca.crt:ro

  # A real client authenticating with nothing but its certificate. Everything curl demonstrates by hand,
  # this does on its own - and its logs show it working.
  logstash:
    image: docker.elastic.co/logstash/logstash:${ES_VERSION}
    hostname: logstash
    depends_on:
      es-ror:
        condition: service_healthy
      # The 'ingest' group is not allowed to create indices, only to write into logs-*, so wait for the
      # initializer to have created logs-2026 rather than relying on Logstash losing the race.
      initializer:
        condition: service_healthy
    environment:
      - XPACK_MONITORING_ENABLED=false
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    volumes:
      - ${EXAMPLE_DIR}/confs/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ${EXAMPLE_DIR}/certs/svc-logstash.crt:/certs/svc-logstash.crt:ro
      - ${EXAMPLE_DIR}/certs/svc-logstash.key:/certs/svc-logstash.key:ro
      # The CA that signed the Elasticsearch server certificate, so Logstash can verify the node it
      # connects to - the reverse direction to the client certificate above. That CA belongs to the
      # runner rather than to this example, and this path is deliberately relative to the Compose
      # project directory (runner/, where docker-compose.yml lives), not to this file.
      - ./conf/es/ca.crt:/certs/ca.crt:ro
    networks:
      - ror-network
